[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackbox"
version = "0.1.0"
description = "BLACKBOX — the flight recorder for robot combat."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "opencv-python>=4.9",
    "scenedetect[opencv]>=0.6.4",
    "yt-dlp>=2024.1.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "typer>=0.12",
    "httpx>=0.27",
    "anthropic>=0.34",
    "python-dotenv>=1.0",
    "lxml>=5.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bb = "blackbox.cli:app"

[tool.setuptools.packages.find]
include = ["blackbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
